{% load static %}

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   
    <title>Produto</title>

  <!-- CONEXÃO DO CSS -->
  <link rel="stylesheet" href="{% static 'misaki/css/tela inicial.css' %}">
 <style>
   *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f6f0ff;
        }

        /* ======================
            TOPO
        ======================= */

        .topo{
            background:linear-gradient(135deg,#5a189a,#7b2cbf,#9d4edd);
            height:120px;
            position:relative;
            box-shadow:0 5px 15px rgba(0,0,0,.2);
        }

        .curva{
            position:absolute;
            bottom:-30px;
            width:100%;
            height:60px;
            background:white;
            border-radius:50% 50% 0 0;
        }

        .navbar{
            width:90%;
            max-width:1300px;
            margin:auto;
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:20px 0;
            position:relative;
            z-index:2;
        }

        /* ======================
            MENU
        ======================= */

        .menu{
            display:flex;
            gap:18px;
        }

        .menu button{
            background:white;
            color:#6a0dad;
            border:none;
            padding:12px 25px;
            border-radius:30px;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
            transition:.3s;
        }

        .menu button:hover{
            background:#d8b4fe;
            transform:translateY(-3px);
        }

        /* ======================
            LOGO
        ======================= */

        .logo img{
            width:90px;
            transition:.3s;
        }

        .logo img:hover{
            transform:scale(1.1);
        }

        /* ======================
            ÍCONES
        ======================= */

        .icons-esquerda{
            display:flex;
            gap:20px;
        }

        .icons-esquerda img{
            width:35px;
            cursor:pointer;
            transition:.3s;
        }

        .icons-esquerda img:hover{
            transform:scale(1.2);
        }

        /* ======================
            RESPONSIVO
        ======================= */

        @media(max-width:768px){

            .navbar{
                flex-direction:column;
                gap:20px;
            }

            .menu{
                flex-wrap:wrap;
                justify-content:center;
            }

            .logo img{
                width:70px;
            }

            .icons-esquerda img{
                width:30px;
            }

        }

    


   
 </style>
</head>
<body>
    <!--Topo-->
    <header class="topo">

        <div class="curva"></div>
    
        <div class="navbar">
    
          <div class="menu">
            <button>Home</button>
            <button>Produtos</button>
            <button>Contato</button>
          </div>
    
          <div class="logo">
            <h1><img src="C:\Users\20261016270050\Desktop\misaki\misaki\migrations\static\img\imagensconstrução\m.png" alt="m"></h1>
          </div>
    
          <div class="icons-esquerda">
            <img src="C:\Users\20261016270050\Desktop\misaki\misaki\migrations\static\img\imagensconstrução\sacola.png" alt="compras">
            <img src="C:\Users\20261016270050\Desktop\misaki\misaki\migrations\static\img\imagensconstrução\lupa.png" alt="pesquisar">
          </div>
    
        </div>
    
      </header>

</body>
</html>
