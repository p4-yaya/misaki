{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mikasi Store</title>

  <link rel="stylesheet" href="{% static 'misaki/migrations/style.css' %}">
</head>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f7f0ff;
  }

  /* TOPO */
  .topo {
    background-color: #7A46CB;
    /*cor do fundo do topo*/
    width: 100%;
    /*espaço onde ele estiver inserido (de ponta a ponta).*/
    position: relative;
    z-index: 10;
  }

  .navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 5px 40px;
  }

  /* MENU */
  .menu {
    display: flex;
    gap: 10px;
    justify-content: flex-start;
  }


  .menu button {
    background: #fff;
    color: #6a0dad;
    border: none;
    padding: 12px 25px;
    border-radius: 30px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: .3s;
  }

  .menu button:hover {
    background: #d8b4fe;
    transform: translateY(-3px);
  }

  /* LOGO */
  .logo {
    display: flex;
    justify-content: center;
    /* Garante que o logo fique perfeitamente no centro do bloco */
    margin-top: 10px;
    margin-bottom: -10px;
  }

  .logo img {
    height: 200px;
    width: auto;
  }

  .icons-esquerda,
  .logo,
  .menu {
    flex: 1;
  }

  /* ÍCONES */
  .icons-esquerda {
    display: flex;
    gap: 25px;
  }

  .icons-esquerda img {
    width: 30px;
    transition: .3s;
    cursor: pointer;
  }

  .icons-esquerda img:hover {
    transform: scale(1.2);
  }

  /* BANNER */
  .banner {
    width: 100%;
    display: flex;
    margin-top: -5px;
    position: relative;
    z-index: 1;
  }

  .banner-img {
    max-width: 100%;
    height: auto;
    display: block;
    object-fit: cover;
    margin: 0;
  }

  /* TÍTULO */
  .produto {
    text-align: center;
    color: #5a189a;
    font-size: 40px;
    margin: 50px 0 30px;
    font-family: 'Bubbleboddy', sans-serif;
  }

  /* PRODUTOS */
  .corpo-categoria {
    width: 95%;
    margin: auto;
  }

  .linha {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 30px;
    margin-bottom: 40px;
  }

  .col-4 {
    background: #fff;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 8px 20px rgba(0, 0, 0, .15);
    transition: .4s;
    text-align: center;
  }

  .col-4:hover {
    transform: translateY(-10px);
    box-shadow: 0 15px 25px rgba(90, 24, 154, .35);
  }

  .col-4 img {
    width: 100%;
    padding: 15px;
  }

  /* BOTÃO DE COMPRA */
  .preco {
    background: linear-gradient(90deg, #7b2cbf, #c77dff);
    color: white;
    padding: 18px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: .3s;
  }

  .preco:hover {
    background: linear-gradient(90deg, #5a189a, #9d4edd);
  }

  /* RESPONSIVO */
  @media(max-width:768px) {

    .navbar {
      flex-direction: column;
      gap: 20px;
    }

    .menu {
      flex-wrap: wrap;
      justify-content: center;
    }

    .produto {
      font-size: 32px;
    }

    .logo img {
      width: 80px;
    }

    .banner-img {
      width: 95%;
    }

  }
</style>

<body>

  <header class="topo">

    <div class="curva"></div>

    <div class="navbar">

      <div class="menu">
        <button>Home</button>
        <button>Produtos</button>
        <button>Contato</button>
      </div>

      <div class="logo">
        <h1><img src="\misaki\misaki\migrations\static\img\imagensconstrução\m.png" alt="m"></h1>
      </div>

      <div class="icons-esquerda">
        <img src="\misaki\misaki\migrations\static\img\imagensconstrução\sacola.png" alt="compras">
        <img src="\misaki\misaki\migrations\static\img\imagensconstrução\lupa.png" alt="pesquisar">
      </div>

    </div>

  </header>

  <div class="banner">
    <img src="\misaki\misaki\migrations\static\img\imagensconstrução/fotos.png" alt="banner" class="banner-img">
  </div>

  <div class="corpo-categoria">

    <h2 class="produto">Produtos:</h2>

    <div class="linha">
      <a href="{% url 'misaki:produtos' %}">
        <div class="col-4">
          <img src="\misaki\misaki\migrations\static\img\produtos/pd1.png" alt="">
          <div class="preco">Comprar - R$ 49,90</div>
        </div>
      </a>


      <a href="{% url 'misaki:produtos' %}">
        <div class="col-4">
          <img src="\misaki\misaki\migrations\static\img\produtos/pd2.png" alt="">
          <div class="preco">Comprar - R$ 49,90</div>
        </div>
      </a>

      <a href="{% url 'misaki:produtos' %}">
        <div class="col-4">
          <img src="\misaki\misaki\migrations\static\img\produtos/pd3.png" alt="">
          <div class="preco">Comprar - R$ 49,90</div>
        </div>
      </a>

      <a href="{% url 'misaki:produtos' %}">
        <div class="col-4">
          <img src="\misaki\misaki\migrations\static\img\produtos/pd4.png" alt="">
          <div class="preco">Comprar - R$ 49,90</div>
        </div>
      </a>

      <a href="{% url 'misaki:produtos' %}">
        <div class="col-4">
          <img src="\misaki\misaki\migrations\static\img\produtos/pd5.png" alt="">
          <div class="preco">Comprar - R$ 49,90</div>
        </div>
      </a>

      <a href="{% url 'misaki:produtos' %}">
        <div class="col-4">
          <img src="\misaki\misaki\migrations\static\img\produtos/pd6.png" alt="">
          <div class="preco">Comprar - R$ 49,90</div>
        </div>
      </a>


    </div>

</body>

</html>
